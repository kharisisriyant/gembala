version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gembala
      POSTGRES_PASSWORD: gembala
      POSTGRES_DB: gembala
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://gembala:gembala@postgres:5432/gembala
      AUTH_SECRET: ${AUTH_SECRET}
    depends_on:
      - postgres

volumes:
  postgres_data:
